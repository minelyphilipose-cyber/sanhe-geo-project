spring:
  datasource:
    url: jdbc:mysql://localhost:3306/geo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 192.168.112.175
      port: 6379
      password: 123456
      database: 0

# JWT
geo:
  public-base-url: http://localhost:8080
  wechat:
    client:
      mode: mock
      fault: ""
    open-platform:
      component-appid: ${WECHAT_COMPONENT_APPID:wx514c6537de79de97}
      component-app-secret: ${WECHAT_COMPONENT_SECRET:}
      token: ${WECHAT_TOKEN:GeoWxToken2026A8x9kP3qR7nM}
      encoding-aes-key: ${WECHAT_ENCODING_AES_KEY:Q8wE2rT5yU7iO9pA3sD6fG4hJ1kL8zX5cV2bN7mQ4wE}
      draft-distribution-enabled: false
      auto-publish-enabled: false
      live-verification-blocked: ${WECHAT_LIVE_VERIFICATION_BLOCKED:true}
      live-verification-reason: ${WECHAT_LIVE_VERIFICATION_REASON:domain_icp_filing_pending}
      func-scope-strict-mode: false
      required-draft-func-scopes: [1, 7, 11]
      required-menu-func-scopes: [15]
      auth-type: 1
      backend-auth-callback-url: http://localhost:8080/api/wechat/open-platform/auth/callback
      frontend-callback-url: http://localhost:5173/admin/content/execution
      component-event-url: http://localhost:8080/api/wechat/open-platform/events
      authorizer-message-url: http://localhost:8080/api/wechat/open-platform/messages/$APPID
    menu:
      web-base-url: ${WECHAT_MENU_WEB_BASE_URL:http://localhost:5173}

  douyin:
    client:
      mode: mock
      fault:
        token-expired: false
        upload-failed: false
        create-failed: false
        rate-limit: false
        permission-denied: false
        review-outcome: passed
    open-platform:
      client-key: ${DOUYIN_CLIENT_KEY:}
      client-secret: ${DOUYIN_CLIENT_SECRET:}
      auth-page-url: ${DOUYIN_AUTH_PAGE_URL:https://open.douyin.com/platform/oauth/connect/}
      auth-callback-url: http://localhost:8080/api/douyin/open-platform/auth/callback
      frontend-callback-url: http://localhost:5173/admin/content/execution
      webhook-url: http://localhost:8080/api/douyin/open-platform/webhooks
      required-scopes: [video.create.bind]
    feature:
      image-text:
        enabled: ${DOUYIN_IMAGE_TEXT_ENABLED:true}
        live-verification-blocked: ${DOUYIN_IMAGE_TEXT_LIVE_VERIFICATION_BLOCKED:true}
        live-verification-reason: ${DOUYIN_IMAGE_TEXT_LIVE_VERIFICATION_REASON:domain_icp_filing_pending}

  cookie:
    master-key-id: local-dev-v1
    # Dev-only fallback so local boot does not require exporting GEO_COOKIE_MASTER_KEY_BASE64.
    # Prod keeps the required placeholder from application.yml and must inject a real secret.
    master-key-base64: ${GEO_COOKIE_MASTER_KEY_BASE64:bG9jYWwtZGV2LWNvb2tpZS1tYXN0ZXIta2V5LTMyISE=}

  extension:
    fill-token:
      # Dev-only fallback so local boot does not require exporting FILL_TOKEN_HMAC_SECRET.
      # Prod keeps the required placeholder from application.yml and must inject a real secret.
      hmac-secret: ${FILL_TOKEN_HMAC_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  jwt:
    secret: "huanjing-geo-2024-jwt-secret-key-must-be-at-least-256-bits-long"
    access-token-expire: 7200        # 2小时(秒)
    refresh-token-expire: 604800     # 7天(秒)

  mobile-dashboard:
    web-base-url: ${MOBILE_DASHBOARD_WEB_BASE_URL:http://localhost:3000}
    share-token-salt: ${MOBILE_DASHBOARD_SHARE_TOKEN_SALT:local-dev-mobile-dashboard-share-salt}
    wechat-js-sdk:
      client-mode: mock
      allowed-hosts: localhost
      share-image-url: https://www.huanjingaigeo.com/favicon.png
    entity-judge:
      enabled: true
      platform-codes: deepseek,doubao,qwen,wenxin
      max-projects-per-run: 20
      per-project-limit: 10
      worker-ms: 60000

  llm:
    pool:
      feature-concurrency:
        mobile_judge: 4

  # MinIO
  minio:
    endpoint: http://192.168.112.175:9000
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://192.168.112.175:9000}
    access-key: admin
    secret-key: admin123
    bucket: geo-files
    region: ${MINIO_REGION:us-east-1}

presale:
  security:
    # dev/demo 阶段允许角色覆盖，避免在 sys_user_role 接入前触发 fail-safe 异常
    role-override: true
    role-override-target: manager
