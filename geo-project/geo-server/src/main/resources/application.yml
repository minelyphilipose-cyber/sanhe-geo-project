server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: geo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    hikari:
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME_MS:600000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT_MS:300000}
      keepalive-time: ${DB_HIKARI_KEEPALIVE_TIME_MS:30000}
      validation-timeout: ${DB_HIKARI_VALIDATION_TIMEOUT_MS:5000}

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flyway
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# Logging
logging:
  level:
    com.huanjing.geo: info
    org.springframework.security: info
    org.flywaydb: info

# Security audit executor. CallerRunsPolicy is used when the queue is full so audit events are not dropped.
audit:
  threadpool:
    core-pool-size: ${AUDIT_THREADPOOL_CORE_SIZE:2}
    max-pool-size: ${AUDIT_THREADPOOL_MAX_SIZE:4}
    queue-capacity: ${AUDIT_THREADPOOL_QUEUE_CAPACITY:1000}

article:
  ai-draft:
    threadpool:
      core-pool-size: ${ARTICLE_AI_DRAFT_CORE_POOL_SIZE:4}
      max-pool-size: ${ARTICLE_AI_DRAFT_MAX_POOL_SIZE:4}
      queue-capacity: ${ARTICLE_AI_DRAFT_QUEUE_CAPACITY:100}
      keep-alive-seconds: ${ARTICLE_AI_DRAFT_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${ARTICLE_AI_DRAFT_AWAIT_TERMINATION_SECONDS:30}
    recovery:
      enabled: ${ARTICLE_AI_DRAFT_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${ARTICLE_AI_DRAFT_RECOVERY_FIXED_DELAY_MS:60000}
      stale-minutes: ${ARTICLE_AI_DRAFT_RECOVERY_STALE_MINUTES:15}
      limit: ${ARTICLE_AI_DRAFT_RECOVERY_LIMIT:20}
      resubmit-limit: ${ARTICLE_AI_DRAFT_RECOVERY_RESUBMIT_LIMIT:5}
    dispatch:
      task-submit-limit: ${ARTICLE_AI_DRAFT_DISPATCH_TASK_SUBMIT_LIMIT:5}

semi-auto:
