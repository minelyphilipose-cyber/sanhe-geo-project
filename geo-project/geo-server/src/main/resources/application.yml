server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: geo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    hikari:
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME_MS:600000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT_MS:300000}
      keepalive-time: ${DB_HIKARI_KEEPALIVE_TIME_MS:30000}
      validation-timeout: ${DB_HIKARI_VALIDATION_TIMEOUT_MS:5000}

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flyway
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# Logging
logging:
  level:
    com.huanjing.geo: info
    org.springframework.security: info
    org.flywaydb: info

# Security audit executor. CallerRunsPolicy is used when the queue is full so audit events are not dropped.
audit:
  threadpool:
    core-pool-size: ${AUDIT_THREADPOOL_CORE_SIZE:2}
    max-pool-size: ${AUDIT_THREADPOOL_MAX_SIZE:4}
    queue-capacity: ${AUDIT_THREADPOOL_QUEUE_CAPACITY:1000}

semi-auto:
  platforms:
    profiles:
      toutiao:
        publish-url: ${SEMI_AUTO_TOUTIAO_PUBLISH_URL:https://mp.toutiao.com/profile_v4/graphic/publish}
        cookie-domains:
          - ".toutiao.com"
          - ".bytedance.com"
          - ".snssdk.com"
        required-cookie-names:
          - sessionid
          - sessionid_ss
          - sid_tt
          - sid_guard
        editor-selectors:
          title: "input[placeholder*='标题']"
          content: ".ProseMirror"
          cover: "input[type='file']"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img
      zhihu:
        publish-url: ${SEMI_AUTO_ZHIHU_PUBLISH_URL:https://zhuanlan.zhihu.com/write}
        cookie-domains:
          - ".zhihu.com"
        required-cookie-names:
          - z_c0
          - d_c0
          - _zap
        editor-selectors:
          title: ".WriteIndex-titleInput textarea"
          content: ".public-DraftEditor-content"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img

geo:
  security:
    init-admin-password:
      enabled: ${GEO_INIT_ADMIN_PASSWORD_ENABLED:false}
  brand-geo-site:
    endpoint: ${BRAND_GEO_SITE_ENDPOINT:}
    connect-timeout-ms: ${BRAND_GEO_SITE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${BRAND_GEO_SITE_READ_TIMEOUT_MS:30000}
  douyin:
    client:
      mode: ${DOUYIN_CLIENT_MODE:mock}
      base-url: ${DOUYIN_API_BASE_URL:https://open.douyin.com}
      connect-timeout-ms: ${DOUYIN_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${DOUYIN_REQUEST_TIMEOUT_MS:30000}
  meititejia:
    enabled: ${MEITITEJIA_ENABLED:true}
    mock-mode: ${MEITITEJIA_MOCK_MODE:false}
    base-url: ${MEITITEJIA_BASE_URL:https://www.meititejia.com/meijieapi/daili3}
    secret-id: ${MEITITEJIA_SECRET_ID:}
    secret-key: ${MEITITEJIA_SECRET_KEY:}
    preview-url-base: ${MEITITEJIA_PREVIEW_URL_BASE:}
    sync-enabled: true
    order-status-check-enabled: true
    sync-page-limit: 200
    order-status-batch-size: 50
    news-media-incremental-cron: "0 0 * * * *"
    news-media-full-cron: "0 30 2 * * *"
    news-media-reconcile-cron: "0 30 3 * * *"
    order-status-check-ms: 60000
    connect-timeout-ms: 5000
    request-timeout-ms: 30000
    retry-max-attempts: 3
    retry-backoff-ms: 1000
    rate-limit-qps: 2
    resource-staleness-threshold-minutes: 60
    preview-token-ttl-days: 30
    quota-check-threshold: 0
    balance-safety-factor: 1.1
    content-mode: LINK_ONLY
  report:
    web-base-url: ${REPORT_WEB_BASE_URL:http://127.0.0.1:3000}
    render-timeout-ms: ${REPORT_RENDER_TIMEOUT_MS:30000}
  presale-export:
    browser:
      enabled: ${PRESALE_EXPORT_BROWSER_ENABLED:true}
      preheat-on-startup: ${PRESALE_EXPORT_BROWSER_PREHEAT:true}
      headless: ${PRESALE_EXPORT_BROWSER_HEADLESS:true}
      device-scale-factor: ${PRESALE_EXPORT_DPR:2}
      viewport-width: ${PRESALE_EXPORT_VIEWPORT_WIDTH:1440}
      viewport-height: ${PRESALE_EXPORT_VIEWPORT_HEIGHT:2200}
      browser-start-timeout-ms: ${PRESALE_EXPORT_BROWSER_START_TIMEOUT_MS:10000}
      page-load-timeout-ms: ${PRESALE_EXPORT_PAGE_LOAD_TIMEOUT_MS:30000}
      ready-timeout-ms: ${PRESALE_EXPORT_READY_TIMEOUT_MS:60000}
      pdf-timeout-ms: ${PRESALE_EXPORT_PDF_TIMEOUT_MS:60000}
      acquire-timeout-ms: ${PRESALE_EXPORT_ACQUIRE_TIMEOUT_MS:5000}
      max-concurrency: ${PRESALE_EXPORT_MAX_CONCURRENCY:1}
    worker:
      enabled: ${PRESALE_EXPORT_WORKER_ENABLED:true}
      # v1.0 worker intentionally runs serially; queue waiting is task-level, not kernel-level.
      scan-interval-ms: ${PRESALE_EXPORT_WORKER_SCAN_INTERVAL_MS:1000}
      claim-batch-size: ${PRESALE_EXPORT_WORKER_CLAIM_BATCH_SIZE:1}
      heartbeat-interval-ms: ${PRESALE_EXPORT_WORKER_HEARTBEAT_INTERVAL_MS:30000}
      stale-scan-interval-ms: ${PRESALE_EXPORT_WORKER_STALE_SCAN_INTERVAL_MS:60000}
      stale-running-timeout-ms: ${PRESALE_EXPORT_WORKER_STALE_RUNNING_TIMEOUT_MS:90000}
    retry:
      max-count: ${PRESALE_EXPORT_RETRY_MAX_COUNT:3}
    storage:
      inline-snapshot-max-bytes: ${PRESALE_EXPORT_INLINE_SNAPSHOT_MAX_BYTES:1048576}
      expire-days: ${PRESALE_EXPORT_EXPIRE_DAYS:7}
      debug-retention-days: ${PRESALE_EXPORT_DEBUG_RETENTION_DAYS:7}
      local-root: ${PRESALE_EXPORT_LOCAL_ROOT:target/presale-exports}
    quality:
      enforce-bottom-band: ${PRESALE_EXPORT_ENFORCE_BOTTOM_BAND:true}
      enforce-chart-non-blank: ${PRESALE_EXPORT_ENFORCE_CHART_NON_BLANK:false}
      enforce-page-count: ${PRESALE_EXPORT_ENFORCE_PAGE_COUNT:true}
      bottom-band-px: ${PRESALE_EXPORT_BOTTOM_BAND_PX:110}
    cleanup:
      enabled: ${PRESALE_EXPORT_CLEANUP_ENABLED:true}
      cron: "${PRESALE_EXPORT_CLEANUP_CRON:0 15 3 * * *}"
      batch-size: ${PRESALE_EXPORT_CLEANUP_BATCH_SIZE:1000}
      lock-key: ${PRESALE_EXPORT_CLEANUP_LOCK_KEY:lock:presale-export-cleanup}
      lock-ttl-ms: ${PRESALE_EXPORT_CLEANUP_LOCK_TTL_MS:1800000}
      cron-jitter-ms: ${PRESALE_EXPORT_CLEANUP_CRON_JITTER_MS:60000}
      max-retry-count: ${PRESALE_EXPORT_CLEANUP_MAX_RETRY_COUNT:5}
  dispatch:
    cron: "0 45 10 * * *"
    timezone: "Asia/Shanghai"
    lock-key: "geo:dispatch:scan:lock"
    lock-ttl-seconds: 600
    worker-poll-concurrency: ${WORKER_POLL_CONCURRENCY:4}
    worker-poll-ms: 1000
    retry-check-ms: 30000
    queue-key: "geo:dispatch:queue:zset"
    retry-delays: "1m,5m,15m"
    task-timeout-minutes: 60
    recover-batch-size: 500
    task-retention-days: 90
    model-connect-timeout-ms: 10000
    model-request-timeout-ms: 180000
    resource-busy-retry-min-seconds: ${DISPATCH_RESOURCE_BUSY_RETRY_MIN_SECONDS:30}
    resource-busy-retry-jitter-seconds: ${DISPATCH_RESOURCE_BUSY_RETRY_JITTER_SECONDS:30}
    api-key-aes-secret: ${DISPATCH_API_KEY_AES_SECRET:geo-dispatch-key}
  llm:
    pool:
      enabled: ${GEO_LLM_POOL_ENABLED:true}
      global-concurrency: ${GEO_LLM_POOL_GLOBAL_CONCURRENCY:24}
      lease-ms: ${GEO_LLM_POOL_LEASE_MS:600000}
      lease-renew-interval-ms: ${GEO_LLM_POOL_LEASE_RENEW_INTERVAL_MS:30000}
      lease-safety-ms: ${GEO_LLM_POOL_LEASE_SAFETY_MS:60000}
      shutdown-grace-ms: ${GEO_LLM_POOL_SHUTDOWN_GRACE_MS:30000}
      permit-wait-timeout-ms: ${GEO_LLM_POOL_PERMIT_WAIT_TIMEOUT_MS:120000}
      permit-retry-interval-ms: ${GEO_LLM_POOL_PERMIT_RETRY_INTERVAL_MS:200}
      permit-key-prefix: ${GEO_LLM_POOL_PERMIT_KEY_PREFIX:geo:llm:permit}
      circuit-breaker-failure-threshold: ${GEO_LLM_POOL_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      circuit-breaker-open-duration-ms: ${GEO_LLM_POOL_CIRCUIT_BREAKER_OPEN_DURATION_MS:60000}
  extension:
    fill-token:
      hmac-secret: ${FILL_TOKEN_HMAC_SECRET:__REQUIRED_FILL_TOKEN_HMAC_SECRET__}
      ttl-seconds: ${EXTENSION_FILL_TOKEN_TTL_SECONDS:300}
    long-token:
      ttl-days: ${EXTENSION_LONG_TOKEN_TTL_DAYS:7}
      slide-renew-threshold-days: ${EXTENSION_LONG_TOKEN_SLIDE_RENEW_THRESHOLD_DAYS:1}
    bind-code:
      length: ${EXTENSION_BIND_CODE_LENGTH:8}
      ttl-seconds: ${EXTENSION_BIND_CODE_TTL_SECONDS:600}
      brand-rate-limit-per-5min: ${EXTENSION_BIND_CODE_BRAND_LIMIT_PER_5MIN:5}
      ip-rate-limit-per-5min: ${EXTENSION_BIND_CODE_IP_LIMIT_PER_5MIN:20}
    version:
      allow-prerelease: ${EXTENSION_VERSION_ALLOW_PRERELEASE:false}

presale:
  prompt:
    active-version: v3
  judge:
    concurrent-platforms: 10 # 如需性能优化可调高此值或后续改异步
    temperature: 0
    retry:
      max-attempts: 2 # 总尝试次数;2 表示首次+重试1次
  generate:
    mock: false
    mock-delay-ms: 5000
    mock-fixture-path: fixtures/01-mock-sample-v1.2.json
    threadpool:
      keep-alive-seconds: ${PRESALE_GENERATE_THREADPOOL_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${PRESALE_GENERATE_THREADPOOL_AWAIT_TERMINATION_SECONDS:30}
      generate:
        core-pool-size: ${PRESALE_GENERATE_CORE_POOL_SIZE:4}
        max-pool-size: ${PRESALE_GENERATE_MAX_POOL_SIZE:8}
        queue-capacity: ${PRESALE_GENERATE_QUEUE_CAPACITY:200}
      platform:
        core-pool-size: ${PRESALE_PLATFORM_CORE_POOL_SIZE:10}
        max-pool-size: ${PRESALE_PLATFORM_MAX_POOL_SIZE:16}
        queue-capacity: ${PRESALE_PLATFORM_QUEUE_CAPACITY:50}
    prompt-max-concurrency-per-report: ${PRESALE_PROMPT_MAX_CONCURRENCY_PER_REPORT:24}
    db-write-max-concurrency: ${PRESALE_DB_WRITE_MAX_CONCURRENCY:12}
    allow-synthetic-fallback:
      mock: true
      real: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
