server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: geo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flyway
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# Logging
logging:
  level:
    com.huanjing.geo: info
    org.springframework.security: info
    org.flywaydb: info

geo:
  report:
    web-base-url: ${REPORT_WEB_BASE_URL:http://127.0.0.1:3000}
    render-timeout-ms: ${REPORT_RENDER_TIMEOUT_MS:30000}
  presale-export:
    browser:
      enabled: ${PRESALE_EXPORT_BROWSER_ENABLED:true}
      preheat-on-startup: ${PRESALE_EXPORT_BROWSER_PREHEAT:true}
      headless: ${PRESALE_EXPORT_BROWSER_HEADLESS:true}
      device-scale-factor: ${PRESALE_EXPORT_DPR:2}
      viewport-width: ${PRESALE_EXPORT_VIEWPORT_WIDTH:1440}
      viewport-height: ${PRESALE_EXPORT_VIEWPORT_HEIGHT:2200}
      browser-start-timeout-ms: ${PRESALE_EXPORT_BROWSER_START_TIMEOUT_MS:10000}
      page-load-timeout-ms: ${PRESALE_EXPORT_PAGE_LOAD_TIMEOUT_MS:30000}
      ready-timeout-ms: ${PRESALE_EXPORT_READY_TIMEOUT_MS:60000}
      pdf-timeout-ms: ${PRESALE_EXPORT_PDF_TIMEOUT_MS:60000}
      acquire-timeout-ms: ${PRESALE_EXPORT_ACQUIRE_TIMEOUT_MS:30000}
      max-concurrency: ${PRESALE_EXPORT_MAX_CONCURRENCY:1}
  dispatch:
    cron: "0 55 18 * * *"
    timezone: "Asia/Shanghai"
    lock-key: "geo:dispatch:scan:lock"
    lock-ttl-seconds: 600
    worker-concurrency: ${WORKER_CONCURRENCY:4}
    worker-poll-ms: 1000
    retry-check-ms: 30000
    queue-key: "geo:dispatch:queue:zset"
    retry-delays: "1m,5m,15m"
    task-timeout-minutes: 60
    recover-batch-size: 500
    task-retention-days: 90
    model-connect-timeout-ms: 10000
    model-request-timeout-ms: 180000
    api-key-aes-secret: ${DISPATCH_API_KEY_AES_SECRET:geo-dispatch-key}

presale:
  prompt:
    active-version: v3
  judge:
    concurrent-platforms: 4 # 如需性能优化可调高此值或后续改异步
    temperature: 0
    retry:
      max-attempts: 2 # 总尝试次数;2 表示首次+重试1次
  generate:
    mock: false
    mock-delay-ms: 5000
    mock-fixture-path: fixtures/01-mock-sample-v1.2.json
    allow-synthetic-fallback:
      mock: true
      real: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
