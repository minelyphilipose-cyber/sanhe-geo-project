          - sessionid_ss
          - sid_tt
          - sid_guard
        editor-selectors:
          title: "input[placeholder*='标题']"
          content: ".ProseMirror"
          cover: "input[type='file']"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img
      zhihu:
        publish-url: ${SEMI_AUTO_ZHIHU_PUBLISH_URL:https://zhuanlan.zhihu.com/write}
        cookie-domains:
          - ".zhihu.com"
        required-cookie-names:
          - z_c0
          - d_c0
          - _zap
        editor-selectors:
          title: ".WriteIndex-titleInput textarea"
          content: ".public-DraftEditor-content"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img
      xiaohongshu:
        publish-url: ${SEMI_AUTO_XIAOHONGSHU_PUBLISH_URL:https://creator.xiaohongshu.com/publish/publish}
        cookie-domains:
          - ".xiaohongshu.com"
          - ".xhscdn.com"
        required-cookie-names:
          - web_session
          - a1
        editor-selectors:
          title: "input[placeholder*='标题'], textarea[placeholder*='标题']"
          content: "[contenteditable='true'], textarea[placeholder*='正文'], textarea[placeholder*='内容']"
          cover: "input[type='file']"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img
      baijiahao:
        publish-url: ${SEMI_AUTO_BAIJIAHAO_PUBLISH_URL:https://baijiahao.baidu.com/builder/rc/edit?type=news&is_from_cms=1}
        cookie-domains:
          - ".baidu.com"
          - ".baijiahao.baidu.com"
        required-cookie-names:
          - BDUSS
          - STOKEN
        editor-selectors:
          title: "textarea[placeholder*='标题'], input[placeholder*='标题']"
          content: ".ProseMirror, [contenteditable='true']"
          cover: "input[type='file']"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img
      douyin:
        publish-url: ${SEMI_AUTO_DOUYIN_PUBLISH_URL:https://creator.douyin.com/creator-micro/content/post/article?media_type=article&type=new&enter_from=publish_page}
        cookie-domains:
          - ".douyin.com"
          - ".bytedance.com"
          - ".snssdk.com"
        required-cookie-names:
          - sessionid
          - sid_guard
        editor-selectors:
          title: "input[placeholder*='文章标题'], textarea[placeholder*='文章标题'], input[placeholder*='标题'], textarea[placeholder*='标题']"
          content: "[contenteditable='true'], textarea[placeholder*='正文'], textarea[placeholder*='内容']"
          cover: "input[type='file']"
        allowed-html-tags:
          - p
          - br
          - strong
          - em
          - u
          - h1
          - h2
          - h3
          - ul
          - ol
          - li
          - blockquote
          - a
          - img

geo:
  scheduling:
    pool-size: ${GEO_SCHEDULING_POOL_SIZE:8}
    await-termination-seconds: ${GEO_SCHEDULING_AWAIT_TERMINATION_SECONDS:30}
  storage:
    provider: ${GEO_STORAGE_PROVIDER:minio}
    read-fallback-to-minio: ${GEO_STORAGE_READ_FALLBACK_TO_MINIO:false}
    migration:
      execute-enabled: ${GEO_STORAGE_MIGRATION_EXECUTE_ENABLED:false}
    cos:
      region: ${COS_REGION:ap-nanjing}
      bucket: ${COS_BUCKET:geo-files-1422803602}
      endpoint: ${COS_INTERNAL_ENDPOINT:cos.ap-nanjing.myqcloud.com}
      secret-id: ${COS_SECRET_ID:AKIDUDrTnyymOo1OZZM2Zu20pfKm3A8xc8Tc}
      secret-key: ${COS_SECRET_KEY:0pUzIRqmjgR8uZ1IMEuOgleUErxypV0L}
  security:
    init-admin-password:
      enabled: ${GEO_INIT_ADMIN_PASSWORD_ENABLED:false}
  brand-geo-site:
    connect-timeout-ms: ${BRAND_GEO_SITE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${BRAND_GEO_SITE_READ_TIMEOUT_MS:30000}
  douyin:
    client:
      mode: ${DOUYIN_CLIENT_MODE:mock}
      base-url: ${DOUYIN_API_BASE_URL:https://open.douyin.com}
      connect-timeout-ms: ${DOUYIN_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${DOUYIN_REQUEST_TIMEOUT_MS:30000}
  meititejia:
    enabled: ${MEITITEJIA_ENABLED:true}
    mock-mode: ${MEITITEJIA_MOCK_MODE:false}
    base-url: ${MEITITEJIA_BASE_URL:https://www.meititejia.com/meijieapi/daili3}
    secret-id: ${MEITITEJIA_SECRET_ID:}
    secret-key: ${MEITITEJIA_SECRET_KEY:}
    preview-url-base: ${MEITITEJIA_PREVIEW_URL_BASE:}
    sync-enabled: true
    order-status-check-enabled: true
    sync-page-limit: 200
    order-status-batch-size: 50
    news-media-incremental-cron: "0 0 * * * *"
    news-media-full-cron: "0 30 2 * * *"
    news-media-reconcile-cron: "0 30 3 * * *"
    order-status-check-ms: 60000
    connect-timeout-ms: 5000
    request-timeout-ms: 30000
    retry-max-attempts: 3
    retry-backoff-ms: 1000
    rate-limit-qps: 2
    resource-staleness-threshold-minutes: 60
    preview-token-ttl-days: 30
    quota-check-threshold: 0
    balance-safety-factor: 1.1
    content-mode: LINK_ONLY
  report:
    web-base-url: ${REPORT_WEB_BASE_URL:http://127.0.0.1:3000}
    render-timeout-ms: ${REPORT_RENDER_TIMEOUT_MS:30000}
  mobile-dashboard:
    web-base-url: ${MOBILE_DASHBOARD_WEB_BASE_URL:http://127.0.0.1:5173}
    share-token-salt: ${MOBILE_DASHBOARD_SHARE_TOKEN_SALT:${geo.jwt.secret}}
    default-share-ttl-days: ${MOBILE_DASHBOARD_SHARE_TTL_DAYS:90}
    session-ttl-seconds: ${MOBILE_DASHBOARD_SESSION_TTL_SECONDS:7200}
  content:
    batch-publish:
      poll-ms: ${CONTENT_BATCH_PUBLISH_POLL_MS:30000}
      lock-key: ${CONTENT_BATCH_PUBLISH_LOCK_KEY:geo:content:batch-publish:scheduler:lock}
      lock-ttl-seconds: ${CONTENT_BATCH_PUBLISH_LOCK_TTL_SECONDS:120}
      forum-site-min-execution-interval-ms: ${CONTENT_BATCH_PUBLISH_FORUM_SITE_MIN_EXECUTION_INTERVAL_MS:1000}
      due-candidate-scan-size: ${CONTENT_BATCH_PUBLISH_DUE_CANDIDATE_SCAN_SIZE:100}
    auto-distribution:
      enabled: ${CONTENT_AUTO_DISTRIBUTION_ENABLED:true}
      cron: "${CONTENT_AUTO_DISTRIBUTION_CRON:0 0 1 * * ?}"
      progress-poll-ms: ${CONTENT_AUTO_DISTRIBUTION_PROGRESS_POLL_MS:60000}
      lock-key: ${CONTENT_AUTO_DISTRIBUTION_LOCK_KEY:geo:content:auto-distribution:daily-lock}
      progress-lock-key: ${CONTENT_AUTO_DISTRIBUTION_PROGRESS_LOCK_KEY:geo:content:auto-distribution:progress-lock}
      lock-ttl-seconds: ${CONTENT_AUTO_DISTRIBUTION_LOCK_TTL_SECONDS:1800}
      publish-window-start: ${CONTENT_AUTO_DISTRIBUTION_PUBLISH_WINDOW_START:01:00}
      publish-window-end: ${CONTENT_AUTO_DISTRIBUTION_PUBLISH_WINDOW_END:23:00}
      publish-time-jitter-minutes: ${CONTENT_AUTO_DISTRIBUTION_JITTER_MINUTES:15}
      operator-user-id: ${CONTENT_AUTO_DISTRIBUTION_OPERATOR_USER_ID:0}
      stale-generation-timeout-hours: ${CONTENT_AUTO_DISTRIBUTION_STALE_GENERATION_TIMEOUT_HOURS:24}
  presale-export:
    browser:
      enabled: ${PRESALE_EXPORT_BROWSER_ENABLED:true}
      preheat-on-startup: ${PRESALE_EXPORT_BROWSER_PREHEAT:true}
      headless: ${PRESALE_EXPORT_BROWSER_HEADLESS:true}
      device-scale-factor: ${PRESALE_EXPORT_DPR:2}
      viewport-width: ${PRESALE_EXPORT_VIEWPORT_WIDTH:1440}
      viewport-height: ${PRESALE_EXPORT_VIEWPORT_HEIGHT:2200}
      browser-start-timeout-ms: ${PRESALE_EXPORT_BROWSER_START_TIMEOUT_MS:10000}
      page-load-timeout-ms: ${PRESALE_EXPORT_PAGE_LOAD_TIMEOUT_MS:30000}
      ready-timeout-ms: ${PRESALE_EXPORT_READY_TIMEOUT_MS:60000}
      pdf-timeout-ms: ${PRESALE_EXPORT_PDF_TIMEOUT_MS:60000}
      acquire-timeout-ms: ${PRESALE_EXPORT_ACQUIRE_TIMEOUT_MS:5000}
      max-concurrency: ${PRESALE_EXPORT_MAX_CONCURRENCY:1}
    worker:
      enabled: ${PRESALE_EXPORT_WORKER_ENABLED:true}
      # v1.0 worker intentionally runs serially; queue waiting is task-level, not kernel-level.
      scan-interval-ms: ${PRESALE_EXPORT_WORKER_SCAN_INTERVAL_MS:1000}
      claim-batch-size: ${PRESALE_EXPORT_WORKER_CLAIM_BATCH_SIZE:1}
      heartbeat-interval-ms: ${PRESALE_EXPORT_WORKER_HEARTBEAT_INTERVAL_MS:30000}
      stale-scan-interval-ms: ${PRESALE_EXPORT_WORKER_STALE_SCAN_INTERVAL_MS:60000}
      stale-running-timeout-ms: ${PRESALE_EXPORT_WORKER_STALE_RUNNING_TIMEOUT_MS:90000}
    retry:
      max-count: ${PRESALE_EXPORT_RETRY_MAX_COUNT:3}
    storage:
      inline-snapshot-max-bytes: ${PRESALE_EXPORT_INLINE_SNAPSHOT_MAX_BYTES:1048576}
      expire-days: ${PRESALE_EXPORT_EXPIRE_DAYS:7}
      debug-retention-days: ${PRESALE_EXPORT_DEBUG_RETENTION_DAYS:7}
      local-root: ${PRESALE_EXPORT_LOCAL_ROOT:target/presale-exports}
    quality:
      enforce-bottom-band: ${PRESALE_EXPORT_ENFORCE_BOTTOM_BAND:true}
      enforce-chart-non-blank: ${PRESALE_EXPORT_ENFORCE_CHART_NON_BLANK:false}
      enforce-page-count: ${PRESALE_EXPORT_ENFORCE_PAGE_COUNT:true}
      bottom-band-px: ${PRESALE_EXPORT_BOTTOM_BAND_PX:110}
    cleanup:
      enabled: ${PRESALE_EXPORT_CLEANUP_ENABLED:true}
      cron: "${PRESALE_EXPORT_CLEANUP_CRON:0 15 3 * * *}"
      batch-size: ${PRESALE_EXPORT_CLEANUP_BATCH_SIZE:1000}
      lock-key: ${PRESALE_EXPORT_CLEANUP_LOCK_KEY:lock:presale-export-cleanup}
      lock-ttl-ms: ${PRESALE_EXPORT_CLEANUP_LOCK_TTL_MS:1800000}
      cron-jitter-ms: ${PRESALE_EXPORT_CLEANUP_CRON_JITTER_MS:60000}
      max-retry-count: ${PRESALE_EXPORT_CLEANUP_MAX_RETRY_COUNT:5}
  dispatch:
    cron: "0 5 0 * * *"
    timezone: "Asia/Shanghai"
    lock-key: "geo:dispatch:scan:lock"
    lock-ttl-seconds: 600
    worker-poll-concurrency: ${WORKER_POLL_CONCURRENCY:4}
    worker-poll-ms: 1000
    worker-pop-admission-enabled: ${DISPATCH_WORKER_POP_ADMISSION_ENABLED:true}
    # 0 means worker-poll-concurrency. Larger values re-enable local queueing before execution.
    worker-max-in-flight: ${DISPATCH_WORKER_MAX_IN_FLIGHT:0}
    worker-permit-governor-enabled: ${DISPATCH_WORKER_PERMIT_GOVERNOR_ENABLED:false}
    worker-permit-governor-busy-ratio: ${DISPATCH_WORKER_PERMIT_GOVERNOR_BUSY_RATIO:0.9}
    retry-check-ms: 30000
    queue-key: "geo:dispatch:queue:zset"
    retry-delays: "1m,5m,15m"
    task-timeout-minutes: 60
    recover-batch-size: 500
    task-retention-days: 90
    model-connect-timeout-ms: 10000
    model-request-timeout-ms: 180000
    question-poll-request-timeout-cap-ms: ${DISPATCH_QUESTION_POLL_REQUEST_TIMEOUT_CAP_MS:120000}
    question-poll-shard-size: ${DISPATCH_QUESTION_POLL_SHARD_SIZE:20}
    question-poll-max-shard-size: ${DISPATCH_QUESTION_POLL_MAX_SHARD_SIZE:20}
    # Spread the effective A-tier question set across a seven-day polling cycle.
    question-poll-cycle-days: ${DISPATCH_QUESTION_POLL_CYCLE_DAYS:7}
    question-poll-model-tier: ${DISPATCH_QUESTION_POLL_MODEL_TIER:primary}
    resource-busy-retry-min-seconds: ${DISPATCH_RESOURCE_BUSY_RETRY_MIN_SECONDS:30}
    resource-busy-retry-jitter-seconds: ${DISPATCH_RESOURCE_BUSY_RETRY_JITTER_SECONDS:30}
    resource-busy-retry-max-seconds: ${DISPATCH_RESOURCE_BUSY_RETRY_MAX_SECONDS:900}
    resource-busy-max-attempts: ${DISPATCH_RESOURCE_BUSY_MAX_ATTEMPTS:60}
    capacity-failure-classification-enabled: ${DISPATCH_CAPACITY_FAILURE_CLASSIFICATION_ENABLED:false}
    resource-busy-retry-after-enabled: ${DISPATCH_RESOURCE_BUSY_RETRY_AFTER_ENABLED:false}
    auto-content-generation-enabled: ${DISPATCH_AUTO_CONTENT_GENERATION_ENABLED:false}
    api-key-aes-secret: ${DISPATCH_API_KEY_AES_SECRET:geo-dispatch-key}
    # Required before enabling web-search profiles; blank stores only the sanitized payload.
    poll-audit-payload-secret: ${POLL_AUDIT_PAYLOAD_SECRET:}
    stagger:
      enabled: ${DISPATCH_STAGGER_ENABLED:false}
      task-types: ${DISPATCH_STAGGER_TASK_TYPES:BI_DAILY_POLL}
      window-minutes: ${DISPATCH_STAGGER_WINDOW_MINUTES:60}
      max-delay-minutes: ${DISPATCH_STAGGER_MAX_DELAY_MINUTES:60}
      jitter-seconds: ${DISPATCH_STAGGER_JITTER_SECONDS:60}
      cap-jitter-seconds: ${DISPATCH_STAGGER_CAP_JITTER_SECONDS:60}
      max-queue-size: ${DISPATCH_STAGGER_MAX_QUEUE_SIZE:0}
      overflow-policy: ${DISPATCH_STAGGER_OVERFLOW_POLICY:ALERT_ONLY}
      platforms:
        hunyuan:
          window-minutes: ${DISPATCH_STAGGER_HUNYUAN_WINDOW_MINUTES:1440}
          max-delay-minutes: ${DISPATCH_STAGGER_HUNYUAN_MAX_DELAY_MINUTES:1440}
          jitter-seconds: ${DISPATCH_STAGGER_HUNYUAN_JITTER_SECONDS:300}
          cap-jitter-seconds: ${DISPATCH_STAGGER_HUNYUAN_CAP_JITTER_SECONDS:300}
        yuanbao:
          window-minutes: ${DISPATCH_STAGGER_YUANBAO_WINDOW_MINUTES:1440}
          max-delay-minutes: ${DISPATCH_STAGGER_YUANBAO_MAX_DELAY_MINUTES:1440}
          jitter-seconds: ${DISPATCH_STAGGER_YUANBAO_JITTER_SECONDS:300}
          cap-jitter-seconds: ${DISPATCH_STAGGER_YUANBAO_CAP_JITTER_SECONDS:300}
  llm:
    routing:
      article-excluded-platform-codes: ${GEO_LLM_ROUTING_ARTICLE_EXCLUDED_PLATFORM_CODES:hunyuan,yuanbao}
      # Long-form article calls need enough headroom for 2000-3000 Chinese characters.
      # Keep this below the 360-second browser and Nginx timeout.
      article-request-timeout-ms: ${GEO_LLM_ROUTING_ARTICLE_REQUEST_TIMEOUT_MS:300000}
    pool:
      enabled: ${GEO_LLM_POOL_ENABLED:true}
      global-concurrency: ${GEO_LLM_POOL_GLOBAL_CONCURRENCY:36}
      lease-ms: ${GEO_LLM_POOL_LEASE_MS:600000}
      lease-renew-interval-ms: ${GEO_LLM_POOL_LEASE_RENEW_INTERVAL_MS:30000}
      lease-safety-ms: ${GEO_LLM_POOL_LEASE_SAFETY_MS:60000}
      shutdown-grace-ms: ${GEO_LLM_POOL_SHUTDOWN_GRACE_MS:30000}
      permit-wait-timeout-ms: ${GEO_LLM_POOL_PERMIT_WAIT_TIMEOUT_MS:120000}
      permit-retry-interval-ms: ${GEO_LLM_POOL_PERMIT_RETRY_INTERVAL_MS:200}
      # Compatibility switch: acquireBlocking keeps its method name; fail-fast applies only to explicitly listed features.
      blocking-acquire-fail-fast-enabled: ${GEO_LLM_POOL_BLOCKING_ACQUIRE_FAIL_FAST_ENABLED:false}
      blocking-acquire-fail-fast-features: ${GEO_LLM_POOL_BLOCKING_ACQUIRE_FAIL_FAST_FEATURES:}
      permit-key-prefix: ${GEO_LLM_POOL_PERMIT_KEY_PREFIX:geo:llm:permit}
      circuit-breaker-failure-threshold: ${GEO_LLM_POOL_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      circuit-breaker-open-duration-ms: ${GEO_LLM_POOL_CIRCUIT_BREAKER_OPEN_DURATION_MS:60000}
      feature-concurrency:
        monitoring: ${GEO_LLM_POOL_FEATURE_MONITORING:8}
        article: ${GEO_LLM_POOL_FEATURE_ARTICLE:4}
        presale: ${GEO_LLM_POOL_FEATURE_PRESALE:12}
        baseline: ${GEO_LLM_POOL_FEATURE_BASELINE:16}
        mobile_judge: ${GEO_LLM_POOL_FEATURE_MOBILE_JUDGE:4}
        draft: ${GEO_LLM_POOL_FEATURE_DRAFT:4}
        generic: ${GEO_LLM_POOL_FEATURE_GENERIC:4}
    capacity-alert:
      enabled: ${GEO_LLM_CAPACITY_ALERT_ENABLED:true}
      scan-fixed-delay-ms: ${GEO_LLM_CAPACITY_ALERT_SCAN_FIXED_DELAY_MS:120000}
      window-minutes: ${GEO_LLM_CAPACITY_ALERT_WINDOW_MINUTES:10}
      min-calls-for-ratio: ${GEO_LLM_CAPACITY_ALERT_MIN_CALLS_FOR_RATIO:20}
      rate-limit-ratio-threshold: ${GEO_LLM_CAPACITY_ALERT_RATE_LIMIT_RATIO_THRESHOLD:0.05}
      recipient-role: ${GEO_LLM_CAPACITY_ALERT_RECIPIENT_ROLE:super_admin}
      hunyuan:
        platform-codes: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_PLATFORM_CODES:hunyuan,yuanbao}
        active-peak-threshold: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_ACTIVE_PEAK_THRESHOLD:5}
        active-peak-sustained-minutes: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_ACTIVE_PEAK_SUSTAINED_MINUTES:5}
        progress-lag-warn-ratio: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_PROGRESS_LAG_WARN_RATIO:0.20}
        progress-lag-sustained-minutes: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_PROGRESS_LAG_SUSTAINED_MINUTES:30}
        final-completion-critical-ratio: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_FINAL_COMPLETION_CRITICAL_RATIO:0.95}
        slice-start-minute-of-day: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_SLICE_START_MINUTE_OF_DAY:5}
        completion-grace-minutes: ${GEO_LLM_CAPACITY_ALERT_HUNYUAN_COMPLETION_GRACE_MINUTES:60}
  extension:
    fill-token:
      hmac-secret: ${FILL_TOKEN_HMAC_SECRET:__REQUIRED_FILL_TOKEN_HMAC_SECRET__}
      ttl-seconds: ${EXTENSION_FILL_TOKEN_TTL_SECONDS:300}
    long-token:
      ttl-days: ${EXTENSION_LONG_TOKEN_TTL_DAYS:7}
      slide-renew-threshold-days: ${EXTENSION_LONG_TOKEN_SLIDE_RENEW_THRESHOLD_DAYS:1}
    bind-code:
      length: ${EXTENSION_BIND_CODE_LENGTH:8}
      ttl-seconds: ${EXTENSION_BIND_CODE_TTL_SECONDS:600}
      brand-rate-limit-per-5min: ${EXTENSION_BIND_CODE_BRAND_LIMIT_PER_5MIN:5}
      ip-rate-limit-per-5min: ${EXTENSION_BIND_CODE_IP_LIMIT_PER_5MIN:20}
    version:
      allow-prerelease: ${EXTENSION_VERSION_ALLOW_PRERELEASE:false}
    env:
      # Readiness prompt only. Keep empty to disable outdated-version warnings.
      expected-version: ${GEO_ENV_EXTENSION_EXPECTED_VERSION:}

presale:
  prompt:
    active-version: v3
  judge:
    concurrent-platforms: ${PRESALE_JUDGE_CONCURRENT_PLATFORMS:3}
    temperature: 0
    retry:
      max-attempts: 2 # 总尝试次数;2 表示首次+重试1次
  generate:
    mock: false
    mock-delay-ms: 5000
    mock-fixture-path: fixtures/01-mock-sample-v1.2.json
    threadpool:
      keep-alive-seconds: ${PRESALE_GENERATE_THREADPOOL_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${PRESALE_GENERATE_THREADPOOL_AWAIT_TERMINATION_SECONDS:30}
      generate:
        core-pool-size: ${PRESALE_GENERATE_CORE_POOL_SIZE:11}
        max-pool-size: ${PRESALE_GENERATE_MAX_POOL_SIZE:13}
        queue-capacity: ${PRESALE_GENERATE_QUEUE_CAPACITY:200}
      platform:
        core-pool-size: ${PRESALE_PLATFORM_CORE_POOL_SIZE:8}
        max-pool-size: ${PRESALE_PLATFORM_MAX_POOL_SIZE:12}
        queue-capacity: ${PRESALE_PLATFORM_QUEUE_CAPACITY:50}
    prompt-max-concurrency-per-report: ${PRESALE_PROMPT_MAX_CONCURRENCY_PER_REPORT:6}
    db-write-max-concurrency: ${PRESALE_DB_WRITE_MAX_CONCURRENCY:6}
    max-concurrent-reports: ${PRESALE_MAX_CONCURRENT_REPORTS:2}
    capacity-failure-defer-enabled: ${PRESALE_GENERATE_CAPACITY_FAILURE_DEFER_ENABLED:false}
    queue-dispatch:
      batch-size: ${PRESALE_QUEUE_DISPATCH_BATCH_SIZE:10}
    recovery:
      enabled: ${PRESALE_GENERATE_RECOVERY_ENABLED:true}
      scan-interval-ms: ${PRESALE_GENERATE_RECOVERY_SCAN_INTERVAL_MS:60000}
      running-timeout-ms: ${PRESALE_GENERATE_RECOVERY_RUNNING_TIMEOUT_MS:900000}
      batch-size: ${PRESALE_GENERATE_RECOVERY_BATCH_SIZE:50}
    allow-synthetic-fallback:
      mock: true
      real: false

baseline:
  collection:
    sample-executor:
      core-pool-size: ${BASELINE_COLLECTION_SAMPLE_CORE_POOL_SIZE:12}
      max-pool-size: ${BASELINE_COLLECTION_SAMPLE_MAX_POOL_SIZE:16}
      queue-capacity: ${BASELINE_COLLECTION_SAMPLE_QUEUE_CAPACITY:512}
      await-termination-seconds: ${BASELINE_COLLECTION_SAMPLE_AWAIT_TERMINATION_SECONDS:30}
    db-write-max-concurrency: ${BASELINE_COLLECTION_DB_WRITE_MAX_CONCURRENCY:6}
    transient-retry-max-attempts: ${BASELINE_COLLECTION_TRANSIENT_RETRY_MAX_ATTEMPTS:2}
    transient-retry-initial-backoff-ms: ${BASELINE_COLLECTION_TRANSIENT_RETRY_INITIAL_BACKOFF_MS:800}
    transient-retry-max-backoff-ms: ${BASELINE_COLLECTION_TRANSIENT_RETRY_MAX_BACKOFF_MS:5000}
    model-connect-timeout-ms: ${BASELINE_COLLECTION_MODEL_CONNECT_TIMEOUT_MS:10000}
    model-request-timeout-ms: ${BASELINE_COLLECTION_MODEL_REQUEST_TIMEOUT_MS:45000}
    max-concurrent-baselines: ${BASELINE_COLLECTION_MAX_CONCURRENT_BASELINES:1}
    capacity-failure-defer-enabled: ${BASELINE_COLLECTION_CAPACITY_FAILURE_DEFER_ENABLED:false}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
