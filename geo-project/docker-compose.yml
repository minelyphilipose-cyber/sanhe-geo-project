version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: geo_root_2024
      MYSQL_DATABASE: geo_delivery
      MYSQL_USER: geo_app
      MYSQL_PASSWORD: geo_app_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: geo-minio
    environment:
      MINIO_ROOT_USER: geo_minio
      MINIO_ROOT_PASSWORD: geo_minio_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # xxl-job-admin:
  #   image: xuxueli/xxl-job-admin:2.4.0
  #   container_name: geo-xxl-job
  #   ports:
  #     - "8090:8080"
  #   environment:
  #     PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/geo_delivery?useUnicode=true&characterEncoding=UTF-8 --spring.datasource.username=geo_app --spring.datasource.password=geo_app_2024"
  #   depends_on:
  #     - mysql

volumes:
  mysql-data:
  redis-data:
  minio-data:
