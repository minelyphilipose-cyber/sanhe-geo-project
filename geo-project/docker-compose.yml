services:
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
      - --log-bin-trust-function-creators=1   # ← 新增这一行
    expose:
      - "3306"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: ${MYSQL_MEM_LIMIT:-2g}
    cpus: ${MYSQL_CPUS:-1.5}

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-0.5}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: geo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    cpus: ${MINIO_CPUS:-1.0}

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: geo-minio-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" || true
        mc admin policy attach local readwrite --user "$${MINIO_APP_ACCESS_KEY}"
        mc anonymous set download "local/$${MINIO_BUCKET}"

  geo-server:
    image: sanhe-geo/geo-server:${IMAGE_TAG}
    build:
      context: ./geo-server
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://maven.aliyun.com/repository/public}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://npmmirror.com/mirrors/playwright}
    container_name: geo-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_HOME: /app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      - geo-server-logs:/app/logs
      - presale-exports:/app/data/presale-exports
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ': >/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 60s
    stop_grace_period: ${GEO_SERVER_STOP_GRACE_PERIOD:-45s}
    mem_limit: ${GEO_SERVER_MEM_LIMIT:-4g}
    cpus: ${GEO_SERVER_CPUS:-2.0}

  geo-web:
    image: sanhe-geo/geo-web:${IMAGE_TAG}
    build:
      context: ./geo-web
      dockerfile: Dockerfile
    container_name: geo-web
    restart: unless-stopped
    depends_on:
      geo-server:
        condition: service_healthy
    expose:
      - "80"
    ports:
      # The host-level Nginx is the only trusted public entry and overwrites
      # forwarding headers. Do not expose this bypass port to the Internet.
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: ${GEO_WEB_MEM_LIMIT:-256m}
    cpus: ${GEO_WEB_CPUS:-0.5}

volumes:
  mysql-data:
  redis-data:
  minio-data:
  geo-server-logs:
  presale-exports:
