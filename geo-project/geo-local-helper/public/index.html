<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>GEO 本地助手</title>
    <style>
      body {
        margin: 0;
        color: #172033;
        background: #f5f7fb;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 820px;
        margin: 32px auto;
        padding: 0 20px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 22px;
      }
      section {
        margin-bottom: 16px;
        padding: 18px;
        border: 1px solid #dbe3f0;
        border-radius: 8px;
        background: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      select {
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
      }
      button {
        height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: #245bff;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        color: #172033;
        background: #e8edf7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      .hint {
        color: #5f6b7a;
        margin: 0 0 12px;
      }
      .status {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .status-item {
        padding: 12px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }
      .status-label {
        display: block;
        color: #64748b;
        font-size: 12px;
      }
      .status-value {
        display: block;
        margin-top: 4px;
        font-weight: 700;
        word-break: break-all;
      }
      pre {
        min-height: 120px;
        max-height: 260px;
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        color: #d1fae5;
        background: #111827;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GEO 本地助手</h1>

      <section>
        <p class="hint">本页只保留日常运行所需配置。自媒体账号、品牌、环境绑定与任务领取均在后台页面完成。</p>
        <div class="status">
          <div class="status-item">
            <span class="status-label">服务版本</span>
            <span id="serviceVersion" class="status-value">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">当前环境</span>
            <span id="profileState" class="status-value">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">配对状态</span>
            <span id="pairingState" class="status-value">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">会话 / 操作员</span>
            <span id="sessionState" class="status-value">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">AdsPower</span>
            <span id="adspowerState" class="status-value">-</span>
          </div>
        </div>
        <div class="actions">
          <button id="healthBtn" class="secondary">刷新状态</button>
        </div>
      </section>

      <section>
        <p class="hint">运行环境由当前助手包和配置文件固定。生产包会固定使用生产后台，本地开发包会固定使用本地后台。</p>
        <div class="grid">
          <div>
            <label for="profileDisplay">运行环境</label>
            <input id="profileDisplay" readonly>
          </div>
          <div>
            <label for="profileBackend">当前后台地址</label>
            <input id="profileBackend" readonly>
          </div>
        </div>
      </section>

      <section>
        <p class="hint">首次部署或更换机器时生成一次性配对码，在后台自媒体分发弹窗中输入即可完成绑定。</p>
        <div class="grid">
          <div>
            <label for="helperName">助手名称</label>
            <input id="helperName" value="本机助手">
          </div>
          <div>
            <label for="pairingCode">一次性配对码</label>
            <input id="pairingCode" readonly placeholder="点击生成配对码">
          </div>
        </div>
        <div class="actions">
          <button id="pairingBtn">生成配对码</button>
          <button id="pairingStatusBtn" class="secondary">检查配对状态</button>
        </div>
      </section>

      <section>
        <p class="hint">AdsPower Local API 地址通常保持默认；API Key 只保存在本机运行目录。</p>
        <div class="grid">
          <div>
            <label for="adspowerApiBase">AdsPower Local API</label>
            <input id="adspowerApiBase" value="http://localhost:50325">
          </div>
          <div>
            <label for="adspowerApiKey">AdsPower API Key</label>
            <input id="adspowerApiKey" type="password" placeholder="留空表示保留已保存 Key">
          </div>
        </div>
        <div class="actions">
          <button id="saveAdspowerBtn">保存 AdsPower 配置</button>
          <button id="refreshAdspowerBtn" class="secondary">查看配置状态</button>
        </div>
      </section>

      <section>
        <pre id="log"></pre>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)
      const logEl = $('log')
      let pairingPollTimer = null
      let pairingPollAttempts = 0
      let activeProfile = ''

      function appendLog(value) {
        const text = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
        logEl.textContent = `${new Date().toLocaleTimeString()} ${text}\n\n${logEl.textContent}`.slice(0, 12000)
      }

      async function c2Request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          }
        })
        const body = await response.json().catch(() => ({}))
        if (!response.ok || body.ok === false) throw new Error(body.error || `请求失败：${response.status}`)
        return body
      }

      async function loadHealth() {
        const result = await c2Request('/health')
        $('serviceVersion').textContent = result.version || '-'
        activeProfile = result.activeProfile || result.config?.activeProfile || 'prod'
        $('profileState').textContent = `${result.activeProfileLabel || activeProfile}（${activeProfile}）`
        $('profileDisplay').value = `${result.activeProfileLabel || activeProfile}（${activeProfile}）`
        $('pairingState').textContent = result.paired ? '已配对' : '未配对'
        $('sessionState').textContent = formatSession(result.session)
        $('adspowerState').textContent = result.adspower?.apiKeyConfigured ? '已配置 API Key' : '未配置 API Key'
        $('profileBackend').value = result.config?.trustedBackendBase || ''
        appendLog({
          service: result.service,
          version: result.version,
          activeProfile: result.activeProfile,
          activeProfileLabel: result.activeProfileLabel,
          paired: result.paired,
          session: result.session,
          runtime: result.runtime,
          schedulePoll: result.schedulePoll,
          config: {
            backendBase: result.config?.backendBase,
            trustedBackendBase: result.config?.trustedBackendBase
          }
        })
        return result
      }

      function formatSession(session) {
        if (!session?.sessionId) return '-'
        const values = [`sessionId=${session.sessionId}`]
        if (session.operatorId) values.push(`operatorId=${session.operatorId}`)
        return values.join(' / ')
      }

      async function loadAdspowerSettings() {
        const result = await c2Request('/v1/settings/adspower')
        const settings = result.adspower || {}
        $('adspowerApiBase').value = settings.apiBase || 'http://localhost:50325'
        $('adspowerApiKey').value = ''
        appendLog({
          adspower: {
            apiBase: settings.apiBase,
            apiKeyConfigured: settings.apiKeyConfigured,
            apiKeyPreview: settings.apiKeyPreview || ''
          }
        })
        return result
      }

      function stopPairingPolling() {
        if (pairingPollTimer !== null) {
          window.clearTimeout(pairingPollTimer)
          pairingPollTimer = null
        }
      }

      async function checkPairingStatus({ silent = false } = {}) {
        const result = await c2Request('/v1/c2/pairing-status', {
          method: 'POST',
          body: JSON.stringify({})
        })
        if (!silent || result.paired) appendLog(result)
        if (result.paired) {
          stopPairingPolling()
          $('pairingState').textContent = '已配对'
          appendLog('本地助手已完成配对')
        }
        return result
      }

      function startPairingPolling() {
        stopPairingPolling()
        pairingPollAttempts = 0
        const poll = async () => {
          pairingPollAttempts += 1
          try {
            const result = await checkPairingStatus({ silent: true })
            if (result.paired) return
          } catch (error) {
            appendLog(`自动检查配对状态失败：${error.message}`)
          }
          if (pairingPollAttempts < 60) {
            pairingPollTimer = window.setTimeout(poll, 3000)
          } else {
            pairingPollTimer = null
            appendLog('配对码已超过自动等待时间，如仍未配对请重新生成配对码')
          }
        }
        pairingPollTimer = window.setTimeout(poll, 3000)
      }

      $('healthBtn').addEventListener('click', async () => {
        try {
          await loadHealth()
        } catch (error) {
          appendLog(`读取运行状态失败：${error.message}`)
        }
      })

      $('refreshAdspowerBtn').addEventListener('click', async () => {
        try {
          await loadAdspowerSettings()
        } catch (error) {
          appendLog(`读取 AdsPower 配置失败：${error.message}`)
        }
      })

      $('saveAdspowerBtn').addEventListener('click', async () => {
        try {
          const result = await c2Request('/v1/settings/adspower', {
            method: 'POST',
            body: JSON.stringify({
              apiBase: $('adspowerApiBase').value,
              apiKey: $('adspowerApiKey').value
            })
          })
          $('adspowerApiKey').value = ''
          $('adspowerState').textContent = result.adspower?.apiKeyConfigured ? '已配置 API Key' : '未配置 API Key'
          appendLog({
            saved: true,
            adspower: result.adspower
          })
        } catch (error) {
          appendLog(`保存 AdsPower 配置失败：${error.message}`)
        }
      })

      $('pairingBtn').addEventListener('click', async () => {
        try {
          const result = await c2Request('/v1/c2/pairing-code', {
            method: 'POST',
            body: JSON.stringify({ helperName: $('helperName').value || '本机助手' })
          })
          $('pairingCode').value = result.pairingCode || ''
          appendLog({
            pairingCode: result.pairingCode,
            expiresAt: result.expiresAt,
            next: '请把配对码输入后台自媒体分发弹窗'
          })
          startPairingPolling()
        } catch (error) {
          appendLog(`生成配对码失败：${error.message}`)
        }
      })

      $('pairingStatusBtn').addEventListener('click', async () => {
        try {
          await checkPairingStatus()
        } catch (error) {
          appendLog(`检查配对状态失败：${error.message}`)
        }
      })

      Promise.allSettled([loadHealth(), loadAdspowerSettings()]).catch(() => {})
    </script>
  </body>
</html>
