<svg width="300" height="72" viewBox="0 0 300 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">幻境AI Fantasy GEO</title>
  <desc id="desc">Horizontal brand lockup using the Fantasy GEO engine-flow mark.</desc>
  <defs>
    <linearGradient id="geoMark" x1="20%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="geoArrow" x1="20%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="86" y1="18" x2="188" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <filter id="lockupShadow" x="0" y="0" width="300" height="72" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000B1A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#lockupShadow)">
    <g transform="translate(36 36) scale(0.62)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M38.04 -12.36A40 40 0 1 0 38.04 12.36L26.63 4.32A28 28 0 1 1 26.63 -4.32Z" fill="url(#geoMark)"/>
      <path d="M8 -4H36V-12L54 0L36 12V4H8Z" fill="url(#geoArrow)"/>
    </g>
    <text x="82" y="34" fill="url(#wordmark)" font-family="'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="2.7">幻境AI</text>
    <path d="M84 50H104" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="114" y="54" fill="#BFD8F6" font-family="Inter, 'SFMono-Regular', Consolas, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.8">FANTASY GEO</text>
  </g>
</svg>
