map $http_x_real_ip $trusted_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    client_max_body_size 50m;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Mobile dashboard share entries need server-resolved metadata so WeChat
    # can render the unchanged /m/{shareCode} URL as a customer-named card.
    location ~* "^/m/([A-HJ-NP-Z2-9]{8})(?:/.*)?$" {
        set $mobile_dashboard_share_code $1;
        auth_request /_mobile-dashboard-share-card-meta;
        auth_request_set $mobile_dashboard_share_title $upstream_http_x_mobile_dashboard_share_title;
        auth_request_set $mobile_dashboard_share_description $upstream_http_x_mobile_dashboard_share_description;
        auth_request_set $mobile_dashboard_share_image $upstream_http_x_mobile_dashboard_share_image;
        auth_request_set $mobile_dashboard_share_url $upstream_http_x_mobile_dashboard_share_url;
        error_page 500 502 503 504 = @mobile-dashboard-html-fallback;

        sub_filter_once on;
        sub_filter '<title>幻境AI · GEO 交付系统</title>' '<title>$mobile_dashboard_share_title</title><meta name="description" content="$mobile_dashboard_share_description" /><meta property="og:type" content="website" /><meta property="og:title" content="$mobile_dashboard_share_title" /><meta property="og:description" content="$mobile_dashboard_share_description" /><meta property="og:url" content="$mobile_dashboard_share_url" /><meta property="og:image" content="$mobile_dashboard_share_image" /><meta itemprop="name" content="$mobile_dashboard_share_title" /><meta itemprop="description" content="$mobile_dashboard_share_description" /><meta itemprop="image" content="$mobile_dashboard_share_image" />';

        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Metadata lookup is optional. If the backend is unavailable, serve the
    # original SPA shell so dashboard access is never blocked by card metadata.
    location @mobile-dashboard-html-fallback {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /_mobile-dashboard-share-card-meta {
        internal;
        proxy_pass http://geo-server:8080/api/public/mobile-dashboard/share-card-meta;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Mobile-Dashboard-Share-Code $mobile_dashboard_share_code;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Vue SPA — 所有前端路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Article generation may need several minutes while waiting for the LLM response.
    location ^~ /api/content/articles/template- {
        proxy_pass http://geo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    location = /api/content/articles/ai-draft/preview {
        proxy_pass http://geo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # Model diagnostics have a 180-second end-to-end deadline. Keep this
    # narrowly scoped timeout above the application and browser deadlines.
    location ^~ /api/admin/model-diagnostics/ {
        proxy_pass http://geo-server:8080/api/admin/model-diagnostics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    # API 反代到 Spring Boot
    location /api/ {
        proxy_pass http://geo-server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Legacy production MinIO route retired after the COS cutover. Local
    # development uses the Vite /oss proxy instead of this container config.
    location ^~ /oss/ {
        return 410;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
