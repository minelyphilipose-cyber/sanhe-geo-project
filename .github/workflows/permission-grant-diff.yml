name: Permission Grant Diff

on:
  pull_request:
    paths:
      - "geo-project/docs/scripts/permission-grant-diff.ps1"
      - "geo-project/geo-server/src/main/java/com/huanjing/geo/module/system/service/PermissionService.java"
      - "geo-project/geo-server/src/main/resources/db/migration/*.sql"
      - ".github/workflows/permission-grant-diff.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "geo-project/docs/scripts/permission-grant-diff.ps1"
      - "geo-project/geo-server/src/main/java/com/huanjing/geo/module/system/service/PermissionService.java"
      - "geo-project/geo-server/src/main/resources/db/migration/*.sql"
      - ".github/workflows/permission-grant-diff.yml"

jobs:
  permission-grant-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check DB-compatible permission grants
        shell: pwsh
        run: ./geo-project/docs/scripts/permission-grant-diff.ps1 -FailOnCompatibleDiff
